server:
  port: ${PORT:8086}

spring:
  application:
    name: dgac-ms-empresas-mandantes
    
  # Conexión a base de datos
  datasource:
    url: ${DB_URL:jdbc:postgresql://ep-calm-shape-ap9ewsz3-pooler.c-7.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require}
    username: ${DB_USERNAME:neondb_owner}
    password: ${DB_PASSWORD:npg_pe6Pfsu5FawY}
    driver-class-name: org.postgresql.Driver
    
  # JPA y Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true

# Configuración de integración
empresas-proveedoras:
  base-url: http://DGAC-MS-EMPRESAS-PROVEEDORAS

# Configuración de Eureka (Vital para que el Gateway lo detecte)
eureka:
  instance:
    hostname: localhost
    preferIpAddress: true
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: ${EUREKA_URI:http://localhost:8080/eureka/}